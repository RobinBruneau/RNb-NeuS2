name: Meshroom Plugin Release

# Build the headless testbed for Linux and Windows with the parameters you
# choose, package it (testbed only, the Python side stays in the repository) for
# the mrRNbNeuS2 Meshroom plugin (https://github.com/meshroomHub/mrRNbNeuS2) and
# the command line, and attach one archive per OS to the Release tagged v<version>.
# Everything build/packaging-specific is in tools/build_release.py.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, tagged as v<version> (e.g. 2.0.0)
        type: string
        default: "2.0.0"
        required: true
      linux:
        description: Build Linux archive
        type: boolean
        default: true
      windows:
        description: Build Windows archive
        type: boolean
        default: true
      cuda:
        # for linux must match an nvidia/cuda devel-rockylinux9 tag
        description: CUDA version (e.g. 12.8.1)
        type: string
        default: "12.8.1"
        required: true
      cudaArch:
        # 7.0 and lower disable the fully fused MLPs of tiny-cuda-nn;
        # 12.0 (RTX 50xx) needs CUDA 12.8 or newer
        description: CUDA compute capability list (e.g. 7.5;8.0;8.6)
        type: string
        default: "7.5;8.0;8.6;8.9;9.0;12.0"
        required: true
      prerelease:
        description: Mark the Release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-22.04
    # Official NVIDIA image with nvcc and cuBLAS. Rocky Linux 9 (glibc 2.34)
    # so the testbed also runs on EL9, not only on Ubuntu 22.04 and newer.
    container: nvidia/cuda:${{ inputs.cuda }}-devel-rockylinux9
    steps:
      - name: Install build prerequisites
        run: |
          dnf install -y git gcc gcc-c++ make cmake python3
          dnf clean all
      - uses: actions/checkout@v7
      - name: Build and package
        env:
          VERSION: ${{ inputs.version }}
          CUDA: ${{ inputs.cuda }}
          CUDA_ARCH: ${{ inputs.cudaArch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: python3 tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          # the archive is already compressed
          compression-level: 0

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # No official CUDA container image exists for Windows, so install it
      # directly from NVIDIA's own download server.
      - name: Install CUDA Toolkit
        env:
          CUDA: ${{ inputs.cuda }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verParts = $env:CUDA -split '\.'
          $short = "$($verParts[0]).$($verParts[1])"
          # curand is only used through its device headers (curand_kernel.h).
          $componentNames = @('nvcc','cudart','cublas','cublas_dev','curand','curand_dev','thrust','visual_studio_integration')
          # 'crt' (host_config.h etc.) and 'nvvm' (cicc, the device-code
          # backend nvcc invokes for every .cu file) used to ship as part of
          # 'nvcc' but CUDA 13.0 split them into their own installer
          # components. Neither exists as a separate component pre-13.0, so
          # only request them there.
          if ([int]$verParts[0] -ge 13) { $componentNames += @('crt', 'nvvm') }
          $components = $componentNames | ForEach-Object { "${_}_$short" }
          $url = "https://developer.download.nvidia.com/compute/cuda/$env:CUDA/network_installers/cuda_${env:CUDA}_windows_network.exe"
          $installer = "$env:RUNNER_TEMP\cuda_installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          # No published checksum to pin per-version, so verify the binary is
          # authentically signed by NVIDIA before running it elevated.
          $sig = Get-AuthenticodeSignature -FilePath $installer
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'NVIDIA') {
            throw "CUDA installer failed signature verification: status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
          }
          $proc = Start-Process -FilePath $installer -ArgumentList (@('-s') + $components) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "CUDA installer exited with code $($proc.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$short"
          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "$cudaPath\bin" >> $env:GITHUB_PATH
      # Locates the MSVC toolchain via vswhere/vcvarsall
      # and exports its env vars.
      - name: Setup MSVC environment
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) { throw 'MSVC C++ build tools not found' }
          $vcvarsall = Join-Path $installPath 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvarsall`" x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              echo "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }
      - name: Build and package
        env:
          VERSION: ${{ inputs.version }}
          CUDA: ${{ inputs.cuda }}
          CUDA_ARCH: ${{ inputs.cudaArch }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-windows
          path: dist/*.zip
          if-no-files-found: error
          # the archive is already compressed
          compression-level: 0

  publish:
    needs: [linux, windows]
    # Still runs if only one OS was built this run
    # e.g. a Windows-only rebuild.
    if: >-
      always() && (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      # merge-multiple + pattern: whichever of plugin-linux/plugin-windows
      # exist this run land together in one flat artifacts/ dir.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: plugin-*
          merge-multiple: true
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          CUDA: ${{ inputs.cuda }}
          CUDA_ARCH: ${{ inputs.cudaArch }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          releaseTag="v${VERSION}"
          cudaFlat="cu$(echo "$CUDA" | cut -d. -f1-2 | tr -d .)"  # 12.4.1 -> cu124, as in tools/build_release.py
          notes="**RNb-NeuS2 ${VERSION}, prebuilt testbed**
          - **CUDA**: ${CUDA} (cuBLAS runtime bundled, only an NVIDIA driver supporting CUDA 12 is required; 570 or newer for
            RTX 50xx GPUs)
          - **CUDA compute capabilities**: ${CUDA_ARCH}
          - **Build**: headless testbed (no GUI, no OptiX)

          Each archive extracts to a \`RNb-NeuS2/\` folder that holds the compiled testbed only: \`build/testbed\`
          (\`build\testbed.exe\` on Windows) with its CUDA libraries, and the \`configs/\` and \`utils/\` it reads next to
          \`build/\`. The Python side (\`rnb_neus2\`, \`run_pipeline.py\`) is in the repository. Pick the archive matching your OS.

          **Command line**

          Clone this release, extract the archive next to the clone (it adds \`build/\` to the \`RNb-NeuS2/\` folder; \`configs/\`
          and \`utils/\` are the same files), then run the pipeline with [uv](https://docs.astral.sh/uv/), which installs the
          Python dependencies on the first run (or use a plain venv / conda, see the
          [README](https://github.com/${GH_REPO}#installation)).

          Linux:

          \`\`\`bash
          git clone --depth 1 --branch v${VERSION} https://github.com/${GH_REPO}.git RNb-NeuS2
          tar xzf RNb-NeuS2-${VERSION}-linux-x86_64-${cudaFlat}.tar.gz
          cd RNb-NeuS2
          uv run run_pipeline.py --input normals.sfm --testbed build/testbed --output out
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          git clone --depth 1 --branch v${VERSION} https://github.com/${GH_REPO}.git RNb-NeuS2
          Expand-Archive RNb-NeuS2-${VERSION}-windows-x86_64-${cudaFlat}.zip -DestinationPath . -Force
          cd RNb-NeuS2
          uv run run_pipeline.py --input normals.sfm --testbed build\testbed.exe --output out
          \`\`\`

          With reflectance maps, add \`--has-albedo --albedo-sfm albedos.sfm\` (and \`--mask-sfm masks.sfm\` or
          \`--mask-folder masks/\`). Input formats, options and output frame: see the
          [README](https://github.com/${GH_REPO}#training).

          **Meshroom plugin**

          To run RNb-NeuS2 as a Meshroom node, install the [mrRNbNeuS2](https://github.com/meshroomHub/mrRNbNeuS2) plugin
          from Meshroom's plugin manager, then extract this archive inside the \`mrRNbNeuS2/\` folder the plugin manager created
          (in Meshroom's \`plugins\` folder, or \`MESHROOM_LOCAL_PLUGINS_PATH\`). The node finds the testbed there by default
          (see the plugin README).

          Linux:

          \`\`\`bash
          cd /path/to/plugins/mrRNbNeuS2
          tar xzf /path/to/RNb-NeuS2-${VERSION}-linux-x86_64-${cudaFlat}.tar.gz   # gives mrRNbNeuS2/RNb-NeuS2/build/testbed
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          cd C:\path\to\plugins\mrRNbNeuS2
          Expand-Archive C:\path\to\RNb-NeuS2-${VERSION}-windows-x86_64-${cudaFlat}.zip -DestinationPath .   # gives mrRNbNeuS2\RNb-NeuS2\build\testbed.exe
          \`\`\`"
          ls -l artifacts
          createArgs=(--target "$GITHUB_SHA" --title "RNb-NeuS2 ${VERSION}" --notes "$notes")
          if [ "$PRERELEASE" = "true" ]; then createArgs+=(--prerelease); fi
          gh release view "$releaseTag" >/dev/null 2>&1 || \
            gh release create "$releaseTag" "${createArgs[@]}"
          gh release upload "$releaseTag" artifacts/* --clobber

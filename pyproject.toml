[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnb-neus2"
version = "2.0.0"
description = "RNb-NeuS2 reconstruction pipeline and Meshroom plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21,<2.0",
    "opencv-python",
    "trimesh",
    "scipy",
    "embreex",
    "tqdm",
    "psutil",
    "networkx",
]

[project.scripts]
rnb-neus2 = "run_pipeline:main"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rnb_neus2", "rnb_neus2.*"]
